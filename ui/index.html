<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PadHub</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar" data-tauri-drag-region>
    <div class="logo" data-tauri-drag-region>
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="var(--accent-brand)"/></svg>
      <span>Pad<b>Hub</b></span>
    </div>
    <div class="bar-mid" data-tauri-drag-region>
      <span id="status-pill" class="pill dark hidden"></span>
    </div>
    <nav class="icons">
      <button class="pill upd hidden" id="upd-pill">
        Actualización pendiente
        <svg viewBox="0 0 24 24"><path d="M12 5v13M6 12l6 6 6-6"/></svg>
      </button>
      <button class="ic" id="btn-diag" title="Diagnóstico HID">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></svg>
      </button>
      <button class="ic" id="btn-theme" title="Tema claro/oscuro">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <span class="sep"></span>
      <button class="ic win" id="win-min" title="Minimizar"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button class="ic win" id="win-max" title="Maximizar"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button class="ic win close" id="win-close" title="Cerrar"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
    </nav>
  </header>

  <main id="view"></main>

  <div id="sheet" class="sheet hidden"></div>

  <div id="upd-scrim" class="scrim hidden"></div>
  <div id="upd-pop" class="pop hidden" role="dialog" aria-labelledby="upd-title">
    <div class="pop-icon">
      <svg viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>
    </div>
    <h2 id="upd-title">Nueva versión disponible</h2>
    <p class="pop-ver" id="upd-ver"></p>
    <p class="pop-notes" id="upd-notes"></p>
    <div class="pop-progress hidden" id="upd-prog"><i id="upd-bar"></i></div>
    <p class="pop-status hidden" id="upd-status"></p>
    <div class="pop-actions" id="upd-actions">
      <button class="pill ghost btn big" id="upd-later">Más tarde</button>
      <button class="pill dark btn big" id="upd-go">Descargar e instalar</button>
    </div>
  </div>
</body>
</html>
